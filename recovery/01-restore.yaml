# Velero Restore (openshift-adp). spec.backupName must match a completed Backup
# (see ../backup/01-backup-gitops-dr-gold.yaml). Apply only when you intend to restore.
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: gitops-dr-restore-gold
  namespace: openshift-adp
  labels:
    dr-policy: gold
spec:
  backupName: gitops-dr-gold-backup
  restorePVs: true
  includedNamespaces:
    - dr-gitops-poc
