# PoC workload: predictable disk name for GitOps + OADP restore.
#
# Native KubeVirt VirtualMachineRestore with Ceph RBD often replaces PVCs with random names
# (e.g. restore-<uuid>-...), which makes Argo CD fight the cluster. OADP/Velero restores the
# same Kubernetes objects—including PVC names like test-dr-vm-root—so Git and the live
# cluster stay aligned (Synced / Healthy).
#
# CDI DataVolume imports CirrOS; the PVC name matches the DV name. Adjust storageClassName
# if your external ODF RBD StorageClass differs.
---
apiVersion: v1
kind: Namespace
metadata:
  name: dr-gitops-poc
  labels:
    dr-policy: gold
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: test-dr-vm-root
  namespace: dr-gitops-poc
  labels:
    dr-policy: gold
spec:
  source:
    http:
      url: https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 2Gi
    storageClassName: ocs-external-storagecluster-ceph-rbd
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: test-dr-vm
  namespace: dr-gitops-poc
  labels:
    dr-policy: gold
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        dr-policy: gold
        kubevirt.io/domain: test-dr-vm
    spec:
      domain:
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
        machine:
          type: q35
        resources:
          requests:
            memory: 512Mi
      volumes:
        - name: rootdisk
          dataVolume:
            name: test-dr-vm-root
