# Velero's AWS plugin expects credentials in a single key (here: cloud) as an AWS INI profile.
# The ObjectBucketClaim does not emit that shape, so a short-lived Job reads the OBC Secret
# and creates/updates Secret cloud-credentials idempotently after the claim is Bound.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero-noobaa-creds-bootstrap
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velero-noobaa-creds-bootstrap
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velero-noobaa-creds-bootstrap
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: velero-noobaa-creds-bootstrap
subjects:
  - kind: ServiceAccount
    name: velero-noobaa-creds-bootstrap
    namespace: openshift-adp
---
apiVersion: batch/v1
kind: Job
metadata:
  name: velero-noobaa-creds-bootstrap
  namespace: openshift-adp
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: velero-noobaa-creds-bootstrap
      containers:
        - name: bootstrap
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OBC_SECRET
              value: velero-dr-noobaa
            - name: TARGET_SECRET
              value: cloud-credentials
            - name: TARGET_KEY
              value: cloud
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              echo "Waiting for ObjectBucketClaim Secret ${OBC_SECRET} in ${NS}..."
              for i in $(seq 1 360); do
                if oc get secret -n "${NS}" "${OBC_SECRET}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' 2>/dev/null | grep -q .; then
                  break
                fi
                sleep 5
              done
              KEY="$(oc get secret -n "${NS}" "${OBC_SECRET}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
              SEC="$(oc get secret -n "${NS}" "${OBC_SECRET}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"
              if [[ -z "${KEY}" || -z "${SEC}" ]]; then
                echo "OBC secret keys not ready yet."
                exit 1
              fi
              INI="$(printf '[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n' "${KEY}" "${SEC}")"
              oc create secret generic "${TARGET_SECRET}" -n "${NS}" \
                --from-literal="${TARGET_KEY}=${INI}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "Secret ${TARGET_SECRET} applied."
