# Velero Backup for the PoC. Apply after VM is running and BSL is Available.
# metadata.name must match spec.backupName in ../recovery/01-restore.yaml
# Wait: oc wait backup.velero.io/gitops-dr-gold-backup -n openshift-adp --for=jsonpath='{.status.phase}'=Completed
apiVersion: velero.io/v1
kind: Backup
metadata:
  name: gitops-dr-gold-backup
  namespace: openshift-adp
  labels:
    dr-policy: gold
spec:
  includedNamespaces:
    - dr-gitops-poc
  labelSelector:
    matchLabels:
      dr-policy: gold
  ttl: 720h
