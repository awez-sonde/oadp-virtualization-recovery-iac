# Let the default Argo CD application controller manage dr-gitops-poc (VM, DV, PVCs, etc.).
# Service account name follows the default instance name "openshift-gitops"; if sync fails with RBAC errors,
# confirm: oc get sa -n openshift-gitops | grep application-controller
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-manager-admin
  namespace: dr-gitops-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
