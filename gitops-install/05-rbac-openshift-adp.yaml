# Let Argo CD deploy OADP, OBC, Jobs, DPA, and Velero CRs in openshift-adp.
# Requires namespace openshift-adp to exist first (apply setup/01-oadp-operator.yaml from this repo, or equivalent).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-manager-admin
  namespace: openshift-adp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
